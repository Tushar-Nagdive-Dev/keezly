<div class="dashboard-layout">
  <aside class="sidebar mac-panel">
    <div class="header">
      <h2 class="app-title">Keezly</h2>
    </div>
    <nav class="mac-nav">
      <a class="nav-item active">All Items</a>
      <a class="nav-item">Favorites</a>
      <a class="nav-item">Settings</a>
    </nav>
    <div class="sidebar-footer">
      <button class="mac-button" (click)="lockApp()">Lock App</button>
    </div>
  </aside>

  <main class="content-area">
    <header class="content-header">
      <h3 class="page-title">All Items</h3>
      <button class="mac-button primary-button">
        + New Item
      </button>
    </header>
    
    <div class="item-list mac-panel">
      </div>
  </main>
</div>
