<section class="vault-list-shell">
  <header class="vault-list-header glass">
    <div>
      <h2>Vault</h2>
      <p class="muted">Your encrypted credentials</p>
    </div>

    <div class="actions">
      <input class="search-input" placeholder="Search..." [(ngModel)]="q" (ngModelChange)="search()" />
      <button (click)="openNew()" class="mac-button primary">+ Add</button>
      <button (click)="reload()" class="mac-button outline">Refresh</button>
    </div>
  </header>

  <div *ngIf="loading" class="loader">Loading…</div>

  <!-- <div class="grid" *ngIf="!loading && filtered.length > 0">
    <app-vault-item-card
      *ngFor="let it of filtered"
      [item]="it"
      (edit)="editItem(it)"
      (view)="viewItem(it)">
    </app-vault-item-card>
  </div> -->

  <div class="cards-grid">
    <app-vault-item-card
      *ngFor="let it of filtered; let i = index"
      [item]="it"
      [gradIndex]="i % 5">
    </app-vault-item-card>
  </div>

  <div *ngIf="!loading && filtered.length === 0" class="empty-state">
    <p>No credentials yet</p>
    <button class="mac-button" (click)="openNew()">Add your first credential</button>
  </div>

  <!-- keep global modals in DOM -->
  <app-vault-editor></app-vault-editor>
  <app-vault-view></app-vault-view>
  <app-vault-delete-dialog></app-vault-delete-dialog>
</section>
