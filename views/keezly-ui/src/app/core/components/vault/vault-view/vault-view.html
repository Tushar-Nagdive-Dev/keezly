<div *ngIf="open" class="modal-backdrop" (click)="close()"></div>
<div *ngIf="open" class="view-modal" role="dialog">
  <h3>{{ item?.title }}</h3>
  <div><strong>Username</strong><div>{{ item?.username || '—' }}</div></div>
  <div><strong>URL</strong><div>{{ item?.url || '—' }}</div></div>
  <div><strong>Password</strong>
    <div>
      <span>{{ revealing ? item?.password : '••••••••' }}</span>
      <button (click)="toggleReveal()">👁</button>
      <button (click)="copy()">📋</button>
    </div>
  </div>

  <div *ngIf="item?.notes"><strong>Notes</strong><div>{{ item?.notes }}</div></div>

  <div class="actions">
    <button (click)="edit()" class="mac-button">Edit</button>
    <button (click)="close()" class="mac-button outline">Close</button>
  </div>
</div>
