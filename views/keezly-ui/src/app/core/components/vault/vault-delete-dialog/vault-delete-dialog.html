<div *ngIf="open" class="modal-backdrop" (click)="close()"></div>

<div *ngIf="open" class="delete-modal" role="dialog">
  <h3>Delete credential</h3>
  <p>Are you sure you want to delete <strong>{{ item?.title }}</strong>?</p>
  <div class="actions">
    <button class="mac-button outline" (click)="close()">Cancel</button>
    <button class="mac-button danger" (click)="confirm()" [disabled]="deleting">
      {{ deleting ? 'Deleting…' : 'Delete' }}
    </button>
  </div>
</div>
