<article class="card" role="article">
  <div class="top">
    <div class="favicon">{{ (item.title || '?').charAt(0).toUpperCase() }}</div>
    <div class="meta">
      <div class="title">{{ item.title }}</div>
      <div class="sub">{{ item.username || item.url || '—' }}</div>
    </div>

    <div class="cta">
      <button class="icon" title="Reveal" (click)="toggleReveal()">👁</button>
      <button class="icon" title="Copy" (click)="copyPassword()">📋</button>
      <button class="icon" title="Edit" (click)="onEdit()">✏️</button>
      <button class="icon" title="View" (click)="onView()">🔍</button>
    </div>
  </div>

  <div class="body">
    <div class="field"><label>URL</label><div>{{ item.url || '—' }}</div></div>
    <div class="field"><label>Password</label>
      <div class="pw">{{ revealing ? item.password : '• • • • • • • •' }}</div>
    </div>
  </div>
</article>
