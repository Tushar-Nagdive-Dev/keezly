<article class="vault-card">
  <header class="top-row">
    <div class="favicon">
      {{ item.title.charAt(0).toUpperCase() }}
    </div>

    <div class="meta">
      <div class="title">{{ item.title }}</div>
      <div class="sub">
        {{ item.username || item.url || 'No metadata' }}
      </div>
    </div>

    <div class="actions">
      <button class="icon-btn" (click)="toggleReveal()" title="Reveal password">
        <span *ngIf="!revealing">👁️</span>
        <span *ngIf="revealing">🙈</span>
      </button>

      <button class="icon-btn" (click)="copyPassword()" title="Copy password">
        📋
      </button>

      <button class="icon-btn" (click)="onEdit()" title="Edit">
        ✏️
      </button>

      <button class="icon-btn" (click)="onView()" title="View details">
        🔍
      </button>
    </div>
  </header>

  <section class="body">
    <div class="field">
      <label>URL</label>
      <div class="value">{{ item.url || '—' }}</div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="value">
        {{ revealing ? item.password : '••••••••••••' }}
      </div>
    </div>
  </section>
</article>
